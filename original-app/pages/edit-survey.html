<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Survey</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom tailwind config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#2B4652',     // Dark blue
                        'secondary': '#90A4AD',   // Light blue-gray
                        'light': '#EBEBEB',       // Light gray
                        'dark': '#0D0D0D',        // Almost black
                        'medium': '#575757',      // Medium gray
                        'accent': '#FFD649',      // Yellow accent
                    },
                    fontFamily: {
                        'sans': ['DM Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Custom styles -->
    <link rel="stylesheet" href="../css/styles.css">
    <!-- Boxicons for icons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body class="bg-light min-h-screen flex flex-col">
    <!-- Mobile Navigation Header -->
    <nav class="lg:hidden bg-white border-b border-gray-200 fixed top-0 left-0 right-0 z-30">
        <div class="px-4 py-3 flex justify-between items-center">
            <div class="flex items-center">
                <a href="survey-details.html" id="backToDetailsLink" class="text-medium p-2 rounded-lg hover:bg-light">
                    <i class='bx bx-arrow-back text-2xl'></i>
                </a>
                <h1 class="text-xl font-bold text-primary ml-2">Edit Survey</h1>
            </div>
            <button id="saveSurveyInfoBtn" class="bg-primary text-light px-4 py-2 rounded-lg font-medium hover:bg-opacity-90 transition flex items-center">
                <i class='bx bx-save mr-2'></i> Save
            </button>
        </div>
    </nav>

    <!-- Top Navigation -->
    <nav class="hidden lg:flex justify-between items-center bg-white px-6 py-4 shadow-sm border-b border-gray-100">
        <div class="flex items-center">
            <a href="survey-details.html" id="backToDetailsLink" class="p-2 rounded-lg hover:bg-light text-medium mr-2">
                <i class='bx bx-arrow-back text-2xl'></i>
            </a>
            <h2 class="text-xl font-bold text-primary">Edit Survey</h2>
        </div>
        <button id="saveSurveyInfoBtn" class="bg-primary text-light px-5 py-3 rounded-lg font-medium hover:bg-opacity-90 transition flex items-center">
            <i class='bx bx-save mr-2'></i> Save Changes
        </button>
    </nav>

    <!-- Main content -->
    <main class="lg:pt-0 pt-16 min-h-screen">
        <div class="p-6 max-w-4xl mx-auto">
            <form id="editSurveyForm">
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                    <div class="mb-5">
                        <label for="surveyTitle" class="block text-sm font-medium text-medium mb-2">Survey Title</label>
                        <input type="text" id="surveyTitle" class="w-full px-4 py-3 border border-secondary rounded-lg focus:outline-none focus:ring-2 focus:ring-primary" placeholder="Enter survey title">
                    </div>
                    <div class="mb-5">
                        <label for="surveyDescription" class="block text-sm font-medium text-medium mb-2">Description</label>
                        <textarea id="surveyDescription" rows="3" class="w-full px-4 py-3 border border-secondary rounded-lg focus:outline-none focus:ring-2 focus:ring-primary" placeholder="Enter survey description"></textarea>
                    </div>
                    <div class="mb-5">
                        <label for="surveyStatus" class="block text-sm font-medium text-medium mb-2">Survey Status</label>
                        <select id="surveyStatus" class="w-full px-4 py-3 border border-secondary rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
                            <option value="draft">Draft</option>
                            <option value="active">Active</option>
                            <option value="closed">Closed</option>
                        </select>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <!-- JavaScript -->
    <script src="../js/modal-helpers.js"></script>
    <script src="../js/edit-survey.js"></script>
</body>
</html>
